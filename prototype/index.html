<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GrindsAI — Your personal LC tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f9fafb;
    --bg-muted: #f3f4f6;
    --border: #e5e7eb;
    --border-soft: #eef0f3;
    --text: #111827;
    --text-2: #374151;
    --text-3: #6b7280;
    --text-4: #9ca3af;
    --accent: #10b981;
    --accent-600: #059669;
    --accent-700: #047857;
    --accent-50: #ecfdf5;
    --accent-100: #d1fae5;
    --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.04), 0 1px 1px rgba(17, 24, 39, 0.03);
    --shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 8px 24px -12px rgba(17, 24, 39, 0.08);
    --shadow-lg: 0 1px 2px rgba(17, 24, 39, 0.04), 0 24px 48px -24px rgba(17, 24, 39, 0.18);
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--bg);
    color: var(--text);
    font-feature-settings: "ss01", "cv11";
    letter-spacing: -0.005em;
  }
  button, input, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; height: 40px; padding: 0 16px;
    border-radius: 8px; font-weight: 500; font-size: 14px;
    transition: all 140ms ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent); color: white;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.15), 0 1px 2px rgba(16,185,129,0.25);
  }
  .btn-primary:hover { background: var(--accent-600); }
  .btn-primary:active { transform: translateY(0.5px); }
  .btn-primary:disabled { background: #d1d5db; box-shadow: none; cursor: not-allowed; }
  .btn-ghost { color: var(--text-2); }
  .btn-ghost:hover { color: var(--text); background: var(--bg-muted); }
  .btn-outline {
    border: 1px solid var(--border); background: white; color: var(--text);
  }
  .btn-outline:hover { background: var(--bg-soft); border-color: #d1d5db; }
  .btn-lg { height: 48px; padding: 0 22px; font-size: 15px; border-radius: 10px; }

  .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

  .dotgrid {
    background-image: radial-gradient(rgba(17,24,39,0.08) 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: -1px -1px;
  }
  .fade-mask {
    mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, black 40%, transparent 80%);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; border: 2px solid white; }
  ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--accent-50); color: var(--accent-700);
    font-size: 12px; font-weight: 500;
    border: 1px solid var(--accent-100);
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fade-up { animation: fadeUp 380ms ease both; }
  .fade-up.delay-1 { animation-delay: 60ms; }
  .fade-up.delay-2 { animation-delay: 120ms; }
  .fade-up.delay-3 { animation-delay: 180ms; }
  .fade-up.delay-4 { animation-delay: 240ms; }

  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--text-3); margin-right: 4px; animation: typing 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  .hide-mobile { display: initial; }
  .show-mobile { display: none; }
  @media (max-width: 760px) {
    .hide-mobile { display: none !important; }
    .show-mobile { display: initial; }
  }
</style>
</head>
<body>
<div id="root"></div>

// ─── Auth ─────────────────────────────────────────────────────────────────────
const inputStyle = {
  width: '100%',
  height: 40,
  padding: '0 12px',
  background: 'white',
  border: '1px solid var(--border)',
  borderRadius: 8,
  fontSize: 14,
  outline: 'none',
  transition: 'border-color 120ms, box-shadow 120ms',
};

function Field({ label, right, children }) {
  return (
    <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <span style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        fontSize: 12.5, color: 'var(--text-2)', fontWeight: 500,
      }}>
        {label}
        {right}
      </span>
      {children}
    </label>
  );
}

function Auth({ navigate, initialMode = 'signup' }) {
  const [mode, setMode] = React.useState(initialMode);
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [name, setName] = React.useState('');
  const [showPwd, setShowPwd] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');

  React.useEffect(() => { setMode(initialMode); }, [initialMode]);

  const submit = (e) => {
    e.preventDefault();
    setError('');
    if (!email.includes('@')) { setError('Please enter a valid email.'); return; }
    if (password.length < 6) { setError('Password must be at least 6 characters.'); return; }
    setLoading(true);
    setTimeout(() => { setLoading(false); navigate('chat'); }, 700);
  };

  return (
    <div style={{
      minHeight: '100vh', background: 'var(--bg-soft)',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '40px 20px 24px',
    }}>
      <button onClick={() => navigate('landing')} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 28 }}>
        <Icon.Logo size={32} />
        <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: '-0.01em' }}>GrindsAI</span>
      </button>

      <div className="fade-up" style={{
        width: '100%', maxWidth: 400,
        background: 'white', border: '1px solid var(--border)', borderRadius: 16,
        padding: 28, boxShadow: 'var(--shadow)',
      }}>
        <h1 style={{ fontSize: 22, fontWeight: 600, margin: 0, letterSpacing: '-0.015em' }}>
          {mode === 'signup' ? 'Create your account' : 'Welcome back'}
        </h1>
        <p style={{ margin: '6px 0 22px', color: 'var(--text-3)', fontSize: 14 }}>
          {mode === 'signup' ? 'Start your free 7-day trial. No card required.' : 'Sign in to continue your study session.'}
        </p>

        <button type="button" className="btn btn-outline" style={{ width: '100%', height: 42 }}>
          <Icon.Google size={16} />
          Continue with Google
        </button>

        <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '20px 0' }}>
          <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
          <span className="mono" style={{ fontSize: 11, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>or with email</span>
          <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
        </div>

        <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {mode === 'signup' && (
            <Field label="Name">
              <input value={name} onChange={e => setName(e.target.value)} placeholder="Aoife Murphy" style={inputStyle} />
            </Field>
          )}
          <Field label="Email">
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@school.ie" style={inputStyle} autoComplete="email" />
          </Field>
          <Field
            label="Password"
            right={mode === 'login' && <a href="#" style={{ fontSize: 12, color: 'var(--text-3)' }}>Forgot?</a>}
          >
            <div style={{ position: 'relative' }}>
              <input
                type={showPwd ? 'text' : 'password'}
                value={password} onChange={e => setPassword(e.target.value)}
                placeholder="••••••••"
                style={{ ...inputStyle, paddingRight: 38 }}
                autoComplete={mode === 'signup' ? 'new-password' : 'current-password'}
              />
              <button type="button" onClick={() => setShowPwd(s => !s)} style={{
                position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)',
                color: 'var(--text-4)', padding: 6, display: 'grid', placeItems: 'center',
              }} aria-label="Show password">
                <Icon.Eye size={16} />
              </button>
            </div>
          </Field>

          {error && (
            <div style={{ fontSize: 13, color: '#b91c1c', background: '#fef2f2', border: '1px solid #fecaca', padding: '8px 10px', borderRadius: 8 }}>
              {error}
            </div>
          )}

          <button type="submit" className="btn btn-primary" style={{ width: '100%', height: 42, marginTop: 4 }} disabled={loading}>
            {loading
              ? <span><span className="dot" /><span className="dot" /><span className="dot" /></span>
              : (mode === 'signup' ? 'Create account' : 'Sign in')}
          </button>
        </form>

        <p style={{ marginTop: 20, marginBottom: 0, fontSize: 13.5, color: 'var(--text-3)', textAlign: 'center' }}>
          {mode === 'signup' ? 'Already have an account?' : 'New to GrindsAI?'}{' '}
          <button onClick={() => setMode(mode === 'signup' ? 'login' : 'signup')} style={{ color: 'var(--accent-700)', fontWeight: 500 }}>
            {mode === 'signup' ? 'Sign in' : 'Create one'}
          </button>
        </p>
      </div>

      <p style={{ marginTop: 24, fontSize: 12, color: 'var(--text-4)', textAlign: 'center', maxWidth: 360 }}>
        By continuing you agree to our <a href="#" style={{ textDecoration: 'underline' }}>Terms</a> and <a href="#" style={{ textDecoration: 'underline' }}>Privacy Policy</a>.
      </p>
    </div>
  );
}

// ─── Chat ─────────────────────────────────────────────────────────────────────
const SUBJECTS = [
  { id: 'maths',     name: 'Maths',     icon: 'Triangle',       enabled: true },
  { id: 'biology',   name: 'Biology',   icon: 'Leaf',           enabled: true },
  { id: 'chemistry', name: 'Chemistry', icon: 'Flask',          enabled: true },
  { id: 'physics',   name: 'Physics',   icon: 'Target',         enabled: false },
  { id: 'english',   name: 'English',   icon: 'Book',           enabled: false },
  { id: 'irish',     name: 'Irish',     icon: 'Book',           enabled: false },
];

const STARTERS = {
  maths:     ['Explain the quadratic formula', 'Help me with differentiation', "What's on the Strand 2 syllabus?"],
  biology:   ['How does photosynthesis actually work?', 'Explain the structure of DNA', 'Difference between mitosis and meiosis?'],
  chemistry: ['Explain the mole concept', 'How do I balance redox equations?', 'Why does atomic radius change across a period?'],
};

const SAMPLE_CONVO = [
  { role: 'user', text: "Can you explain Pythagoras' theorem to me?" },
  { role: 'ai',   text: "Great topic! Before I explain it, let me ask you something — if you have a right-angled triangle, what's special about the longest side? Do you know what it's called?" },
  { role: 'user', text: 'Is it called the hypotenuse?' },
  { role: 'ai',   text: "Exactly right. The hypotenuse is always the side opposite the right angle, and it's always the longest side.\n\nNow, Pythagoras noticed a relationship between the lengths of all three sides. If the hypotenuse is c, and the other two sides are a and b — what do you think that relationship might look like? Take a guess, even if you're not sure." },
  { role: 'user', text: 'Is it a² + b² = c²?' },
  { role: 'ai',   text: "Perfect — that's it exactly. **a² + b² = c²**.\n\nNow let's make sure you can *use* it, not just recall it. If a = 3 and b = 4, what is c? Show me your working." },

function renderAI(text) {
  const parts = text.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g);
  return parts.map((p, i) => {
    if (p.startsWith('**') && p.endsWith('**')) return <strong key={i} style={{ fontWeight: 600 }}>{p.slice(2, -2)}</strong>;
    if (p.startsWith('*') && p.endsWith('*')) return <em key={i}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function genericSocraticReply(subjectId, userText) {
  const lower = userText.toLowerCase();
  if ((lower.includes('answer') && (lower.includes('just') || lower.includes('give'))) || lower.includes('tell me')) {
    return "I hear you — but if I just hand you the answer, you'll forget it by Friday. Let's try a smaller version of the problem together. What's the very first thing you'd write down to start it?";
  }
  if (/^\s*c\s*=?\s*5/.test(lower) || lower.includes('=5') || lower.includes('= 5')) {
    return "Spot on — c = 5. You worked through 3² + 4² = 9 + 16 = 25, and √25 = 5.\n\nNow here's the deeper question: *why* does squaring the sides work? What is a² actually measuring, geometrically?";
  }
  if (subjectId === 'biology') {
    return "Good question. Before we dive in — what do *you* already know about it from class? Even a half-remembered detail gives us a starting point we can build from.";
  }
  if (subjectId === 'chemistry') {
    return "Let's think about it from first principles. What does the question actually want you to find — and what information does it hand you for free?";
  }
  return "Nice question. Let me ask you one back: what part of this feels unclear to you right now? Pinpointing that is half the battle.";
}

function Chat({ navigate }) {
  const [subjectId, setSubjectId] = React.useState('maths');
  const [level, setLevel] = React.useState('HL');
  const [messages, setMessages] = React.useState(SAMPLE_CONVO);
  const [draft, setDraft] = React.useState('');
  const [thinking, setThinking] = React.useState(true);
  const [sidebarOpen, setSidebarOpen] = React.useState(false);

  const subject = SUBJECTS.find(s => s.id === subjectId);
  const SubjectIconCmp = Icon[subject.icon] || Icon.Book;
  const threadEndRef = React.useRef(null);
  const taRef = React.useRef(null);

  React.useEffect(() => {
    threadEndRef.current?.scrollTo({ top: threadEndRef.current.scrollHeight, behavior: 'smooth' });
  }, [messages, thinking]);

  const newChat = () => { setMessages([]); setThinking(false); setSidebarOpen(false); };

  const switchSubject = (id) => {
    if (id === subjectId) return;
    setSubjectId(id);
    setMessages([]);
    setThinking(false);
    setSidebarOpen(false);
  };

  const send = (text) => {
    const t = (text ?? draft).trim();
    if (!t) return;
    setMessages(m => [...m, { role: 'user', text: t }]);
    setDraft('');
    setThinking(true);
    setTimeout(() => {
      setMessages(m => [...m, { role: 'ai', text: genericSocraticReply(subjectId, t) }]);
      setThinking(false);
    }, 1100 + Math.random() * 400);
  };

  const useSuggestion = (q) => {
    setDraft(q);
    setTimeout(() => taRef.current?.focus(), 0);
  };

  const onKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };

  React.useEffect(() => {
    const ta = taRef.current;
    if (!ta) return;
    ta.style.height = '0px';
    ta.style.height = Math.min(ta.scrollHeight, 132) + 'px';
  }, [draft]);

  return (
    <div style={{
      display: 'grid',
      gridTemplateColumns: 'auto 1fr',
      height: '100vh', overflow: 'hidden', background: 'white',
    }}>
      <Sidebar
        navigate={navigate}
        subjectId={subjectId} setSubjectId={switchSubject}
        level={level} setLevel={setLevel}
        newChat={newChat}
        open={sidebarOpen} setOpen={setSidebarOpen}
      />

      <main style={{ display: 'flex', flexDirection: 'column', minWidth: 0, height: '100vh' }}>
        <ChatHeader subject={subject} SubjectIconCmp={SubjectIconCmp} level={level} onMenu={() => setSidebarOpen(true)} navigate={navigate} />

        <div ref={threadEndRef} style={{ flex: 1, overflow: 'auto', padding: '32px 0 8px' }}>
          {messages.length === 0 ? (
            <EmptyState subject={subject} SubjectIconCmp={SubjectIconCmp} level={level} onPick={useSuggestion} />
          ) : (
            <div style={{ maxWidth: 760, margin: '0 auto', padding: '0 24px', display: 'flex', flexDirection: 'column', gap: 22 }}>
              {messages.map((m, i) => <ChatMessage key={i} msg={m} />)}
              {thinking && <ThinkingBubble />}
            </div>
          )}
        </div>

        <Composer draft={draft} setDraft={setDraft} taRef={taRef} onKey={onKey} onSend={() => send()} subject={subject} />
      </main>

      {sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} style={{
          position: 'fixed', inset: 0, background: 'rgba(17,24,39,0.4)', zIndex: 80,
          display: 'none',
        }} className="mobile-overlay" />
      )}
      <style>{`
        @media (max-width: 860px) {
          .grindsai-sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 90; transform: translateX(-100%); transition: transform 220ms ease; }
          .grindsai-sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
          .mobile-overlay { display: ${sidebarOpen ? 'block' : 'none'} !important; }
        }
      `}</style>
    </div>
  );
}

// ─── Router ───────────────────────────────────────────────────────────────────
const ROUTES = ['landing', 'login', 'signup', 'chat', 'pricing'];

function App() {
  const [route, setRoute] = React.useState(() => {
    const h = window.location.hash.replace('#', '');
    return ROUTES.includes(h) ? h : 'landing';
  });

  const navigate = React.useCallback((next) => {
    setRoute(next);
    window.location.hash = next;
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, []);

  React.useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.replace('#', '');
      if (ROUTES.includes(h)) setRoute(h);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  switch (route) {
    case 'login':   return <Auth navigate={navigate} initialMode="login" />;
    case 'signup':  return <Auth navigate={navigate} initialMode="signup" />;
    case 'chat':    return <Chat navigate={navigate} />;
    case 'pricing': return <Pricing navigate={navigate} />;
    default:        return <Landing navigate={navigate} />;
  }
}
